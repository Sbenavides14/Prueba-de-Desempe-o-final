<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SismoWatch — Entrar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="brand-row"><span class="dot"></span><h1>SismoWatch</h1></div>
      <p class="login-sub">Monitoreo sísmico global en tiempo casi real</p>
      <form id="login-form">
        <label>Correo<input id="email" type="text" placeholder="tu@correo.com" /></label>
        <label>Contraseña<input id="password" type="password" placeholder="••••••••" /></label>
        <button id="login-btn" type="submit">Entrar</button>
        <p id="login-error" class="error-message" style="display:none"></p>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Si ya hay sesión activa, no tiene sentido ver el login de nuevo.
    const existingRole = localStorage.getItem("role");
    if (existingRole) window.location.href = existingRole === "admin" ? "admin.html" : "viewer.html";

    const form = document.getElementById("login-form");
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Entrando...";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        const data = await api.login(email, password);
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("role", data.role);
        localStorage.setItem("email", email);
        window.location.href = data.role === "admin" ? "admin.html" : "viewer.html";
      } catch (err) {
        errEl.innerHTML = `${Icons.alert(16)} ${err.message || "No pude iniciar sesión."}`;
        errEl.style.display = "flex";
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
